<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Empath</title>

  <!-- Open connections early; the SDKs load at the end of <body> so the page paints first. -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
  <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
  <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
  <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">

  <style>
    /*
     * Tokens from the marketing site (EmpathWebsite/src/app/globals.css), as
     * on login.html and checkout.html.
     */
    :root {
      --ink-50: #f7f7f8;
      --ink-100: #ededf0;
      --ink-200: #d9d9df;
      --ink-400: #8c8c9c;
      --ink-500: #6b6b7b;
      --ink-600: #52525f;
      --ink-800: #26262e;
      --ink-900: #15151a;
      --ink-950: #0b0b0e;
      --accent-500: #dc4733;
      --accent-700: #ab2519;
      --accent-800: #8a1f16;
      --gradient-brand: linear-gradient(to right bottom, #8ac6d9, #77b4e6, #9199e5, #be75c8, #dd4a8d, #e9446b, #e94c47, #de5c1d, #e6771c, #eb9121, #f0aa2c, #f2c33c);
      --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink-800);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    a { color: var(--accent-700); }
    a:hover { color: var(--accent-800); }

    :focus-visible {
      outline: 2px solid var(--accent-500);
      outline-offset: 2px;
    }

    [hidden] { display: none !important; }

    .site-header {
      max-width: 72rem;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink-900);
      text-decoration: none;
    }

    .wordmark:hover { color: var(--ink-900); }

    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 8px 20px 96px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .site-header, main { padding-left: 32px; padding-right: 32px; }
    }

    /* Buttons: every button is a pill */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 0;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-lg { min-height: 48px; padding: 0 24px; font-size: 16px; }
    .btn-primary { background: var(--ink-950); color: #fff; }
    .btn-primary:hover { background: var(--ink-800); color: #fff; }
    .btn-secondary { background: var(--ink-100); color: var(--ink-900); }
    .btn-secondary:hover { background: var(--ink-200); color: var(--ink-900); }
    .btn-ghost { background: #fff; color: var(--ink-800); border: 1px solid var(--ink-200); }
    .btn-ghost:hover { border-color: var(--ink-400); color: var(--ink-800); }
    .btn-inverse { background: #fff; color: var(--ink-900); }
    .btn-inverse:hover { background: var(--ink-100); color: var(--ink-900); }
    .btn-ghost-inverse { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); }
    .btn-ghost-inverse:hover { border-color: #fff; color: #fff; }

    /* Gradient panel: full-strength, always moving */
    .panel {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: var(--gradient-brand);
      color: #fff;
      border-radius: 16px;
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
    }

    @media (max-width: 639px) { .panel { padding: 48px 24px; } }

    .plate { position: absolute; inset: 0; z-index: -1; }
    .p1 {
      background: conic-gradient(from 0deg at 42% 58%, #8ac6d9, #77b4e6, #9199e5, #dd4a8d, #e94c47, #e6771c, #f2c33c, #8ac6d9);
      filter: blur(64px) saturate(115%);
      animation: swirl 26s linear infinite;
    }
    .p2 {
      background: conic-gradient(from 120deg at 62% 40%, #9199e5, #dd4a8d, #e94c47, #e6771c, #9199e5);
      filter: blur(80px);
      mix-blend-mode: multiply;
      opacity: 0.35;
      animation: swirl 18s linear infinite reverse;
    }
    @keyframes swirl {
      from { transform: rotate(0) scale(2); }
      to { transform: rotate(360deg) scale(2); }
    }

    .panel h1 {
      margin: 0;
      font-size: clamp(2.5rem, 1.4rem + 4.4vw, 4.75rem);
      line-height: 1.04;
      letter-spacing: -0.033em;
      font-weight: 800;
      text-wrap: balance;
      text-shadow: 0 1px 24px rgba(90, 20, 30, 0.25);
    }

    .panel-actions { display: flex; flex-wrap: wrap; gap: 12px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      border: 1px solid var(--ink-200);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 639px) { .card { padding: 24px; } }

    .eyebrow {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-900);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-900);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-900);
    }

    .status[data-tone="muted"] { color: var(--ink-600); }
    .status[data-tone="muted"] .status-dot { background: transparent; border: 1.5px solid var(--ink-500); }

    .plan-name {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-900);
    }

    .plan-details {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-500);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
      padding-top: 8px;
    }

    .field {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--ink-100);
      min-height: 69px;
    }

    .field:last-child { border-bottom: 0; }

    .field-label {
      width: 110px;
      font-size: 14px;
      color: var(--ink-500);
    }

    .field-value {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      color: var(--ink-900);
      overflow-wrap: anywhere;
    }

    .field-input {
      flex: 1;
      min-width: 140px;
      font-size: 16px;
      color: var(--ink-900);
      padding: 9px 12px;
      border: 1px solid var(--ink-200);
      border-radius: 8px;
    }

    .field-input:focus-visible { outline-offset: 0; }

    .field-error {
      width: 100%;
      margin: 0;
      font-size: 14px;
      color: var(--accent-700);
    }

    /* Loading placeholders: neutral, sized like the text they stand in for */
    .skeleton .sk {
      display: block;
      border-radius: 6px;
      background: var(--ink-100);
      color: transparent !important;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .skeleton .sk * { visibility: hidden; }
    @keyframes pulse { 50% { opacity: 0.55; } }

    .notice {
      border: 1px solid var(--ink-200);
      background: var(--ink-50);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      color: var(--ink-800);
    }

    @media (prefers-reduced-motion: reduce) {
      .plate { animation: none; transform: rotate(30deg) scale(2); }
      .skeleton .sk { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="https://www.get-empath.com">Empath</a>
    <button class="btn btn-ghost" id="sign-out-btn" type="button">Sign out</button>
  </header>

  <main id="dashboard" class="skeleton" aria-busy="true">
    <div id="notice" class="notice" role="alert" hidden>
      <span id="notice-text"></span>
      <button class="btn btn-secondary" id="retry-btn" type="button">Try again</button>
    </div>

    <section class="panel" aria-labelledby="welcome-message">
      <div class="plate p1"></div>
      <div class="plate p2"></div>
      <h1 id="welcome-message">Welcome.</h1>
      <div class="panel-actions">
        <a class="btn btn-lg btn-inverse" href="https://get-empath.com/download/">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download for macOS
        </a>
      </div>
    </section>

    <div class="cards">
      <section class="card" aria-labelledby="subscription-heading">
        <h2 class="eyebrow" id="subscription-heading">Subscription</h2>
        <div class="status sk" id="subscription-status"><span class="status-dot"></span><span id="status-text">Loading</span></div>
        <p class="plan-name sk" id="plan-name">Loading plan</p>
        <p class="plan-details sk" id="plan-details">Loading plan details</p>
        <div class="card-actions">
          <a class="btn btn-primary" id="manage-billing-btn" href="https://empath.onfastspring.com/account" target="_blank" rel="noopener" hidden>Manage billing</a>
          <a class="btn btn-primary" id="upgrade-btn" href="/checkout?plan=monthly" hidden>Choose a plan</a>
        </div>
      </section>

      <section class="card" aria-labelledby="account-heading">
        <h2 class="eyebrow" id="account-heading">Account</h2>
        <div>
          <div class="field" data-field="firstName">
            <span class="field-label" id="first-name-label">First name</span>
            <span class="field-value sk" data-role="value">Loading</span>
            <input class="field-input" data-role="input" type="text" autocomplete="given-name" aria-labelledby="first-name-label" hidden>
            <button class="btn btn-ghost" data-role="edit" type="button" aria-label="Edit first name">Edit</button>
            <button class="btn btn-primary" data-role="save" type="button" hidden>Save</button>
            <button class="btn btn-secondary" data-role="cancel" type="button" hidden>Cancel</button>
            <p class="field-error" data-role="error" hidden></p>
          </div>
          <div class="field" data-field="lastName">
            <span class="field-label" id="last-name-label">Last name</span>
            <span class="field-value sk" data-role="value">Loading</span>
            <input class="field-input" data-role="input" type="text" autocomplete="family-name" aria-labelledby="last-name-label" hidden>
            <button class="btn btn-ghost" data-role="edit" type="button" aria-label="Edit last name">Edit</button>
            <button class="btn btn-primary" data-role="save" type="button" hidden>Save</button>
            <button class="btn btn-secondary" data-role="cancel" type="button" hidden>Cancel</button>
            <p class="field-error" data-role="error" hidden></p>
          </div>
          <div class="field">
            <span class="field-label">Email</span>
            <span class="field-value sk" id="user-email">Loading</span>
          </div>
          <div class="field" id="activation-row" hidden>
            <span class="field-label">Active since</span>
            <span class="field-value" id="activation-date-text"></span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Firebase SDKs (preloaded in <head>) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyCwpPROFnBDsX4gqdIbVsUgCZGkcvtWEKY',
      authDomain: 'auth.get-empath.com',
      projectId: 'get-empath',
      storageBucket: 'get-empath.firebasestorage.app',
      messagingSenderId: '380829207707',
      appId: '1:380829207707:web:e3b97e0bb83734ba2f4a3e',
      measurementId: 'G-W10VEF7WQL'
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestore = firebase.firestore();

    // The local cache lets a returning visit render from IndexedDB at once,
    // then the live listener corrects it when the server answers.
    firestore.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      console.warn('Firestore persistence unavailable:', err.code || err.message);
    });

    // FastSpring is never called from this page. Its webhook writes the
    // subscription fields onto users/{uid}, so this one document is the
    // whole read, and the listener picks up webhook updates live.
    const LOAD_TIMEOUT_MS = 10000;
    const PLANS = {
      monthly: { name: 'Pro Monthly', details: '$7.99/month · Full access to all features' },
      annual: { name: 'Pro Annual', details: '$79.99/year · Save 17% with annual billing' }
    };

    let currentUser = null;
    let userData = null;
    let unsubscribeUserDoc = null;
    let loadTimer = null;
    let creatingDoc = false;
    let signingOut = false;

    const $ = (id) => document.getElementById(id);

    // Enterprise accounts go back to the enterprise checkout (30-day trial
    // products); checkout itself reads the uid from the signed-in session.
    function getCheckoutPath() {
      return userData && userData.createdVia === 'enterprise_signup'
        ? '/enterprise/checkout'
        : '/checkout';
    }

    function formatDate(timestamp) {
      if (!timestamp) return '';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      if (isNaN(date)) return '';
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function showNotice(message) {
      $('notice-text').textContent = message;
      $('notice').hidden = false;
    }

    function hideNotice() {
      $('notice').hidden = true;
    }

    function markLoaded() {
      const main = $('dashboard');
      main.classList.remove('skeleton');
      main.removeAttribute('aria-busy');
    }

    function checkoutHref(source) {
      const params = new URLSearchParams({
        displayName: (userData && userData.firstName) || currentUser.email.split('@')[0],
        plan: 'monthly',
        source
      });
      return `${getCheckoutPath()}?${params.toString()}`;
    }

    function renderSubscription() {
      const status = userData.subscriptionStatus || 'none';
      const statusEl = $('subscription-status');
      const manageBtn = $('manage-billing-btn');
      const upgradeBtn = $('upgrade-btn');
      let label, name, details, tone = 'solid';

      manageBtn.hidden = true;
      upgradeBtn.hidden = true;
      $('activation-row').hidden = true;

      switch (status) {
        // No subscription. 'free' is from before free plans were dropped.
        case 'none':
        case 'free':
          label = 'No active plan';
          tone = 'muted';
          name = 'No active plan';
          details = 'Choose a plan to start using Empath.';
          upgradeBtn.textContent = 'Choose a plan';
          upgradeBtn.href = checkoutHref('dashboard_upgrade');
          upgradeBtn.hidden = false;
          break;

        case 'active': {
          const plan = PLANS[userData.plan] || { name: 'Pro Plan', details: 'Full access to all features' };
          label = 'Active';
          name = plan.name;
          details = plan.details;
          manageBtn.hidden = false;
          const since = formatDate(userData.subscriptionActivatedAt);
          if (since) {
            $('activation-date-text').textContent = since;
            $('activation-row').hidden = false;
          }
          break;
        }

        case 'trial': {
          const billingStarts = formatDate(userData.nextChargeDate);
          label = 'Free trial';
          name = 'Free Trial';
          details = billingStarts
            ? `Full access to all features. Billing starts ${billingStarts}.`
            : 'Full access to all features during your trial.';
          manageBtn.hidden = false;
          break;
        }

        case 'pending':
          label = 'Pending';
          tone = 'muted';
          name = 'Subscription pending';
          details = 'Your payment is being processed. This page updates on its own when it clears.';
          break;

        case 'canceled':
          label = 'Canceled';
          tone = 'muted';
          name = 'Subscription canceled';
          details = 'Your subscription has been canceled.';
          upgradeBtn.textContent = 'Reactivate';
          upgradeBtn.href = checkoutHref('dashboard_reactivate');
          upgradeBtn.hidden = false;
          break;

        default:
          label = 'Unknown status';
          tone = 'muted';
          name = 'Unknown plan';
          details = 'Please contact support if this persists.';
      }

      statusEl.dataset.tone = tone;
      $('status-text').textContent = label;
      $('plan-name').textContent = name;
      $('plan-details').textContent = details;
    }

    function renderField(fieldName) {
      const row = document.querySelector(`[data-field="${fieldName}"]`);
      // Leave a field alone while it is being edited.
      if (!row.querySelector('[data-role="input"]').hidden) return;
      row.querySelector('[data-role="value"]').textContent = userData[fieldName] || 'Not set';
    }

    // Single render path for the cached snapshot, the server snapshot and
    // every live update after them.
    function render() {
      $('welcome-message').textContent = userData.firstName
        ? `Welcome, ${userData.firstName}.`
        : 'Welcome.';
      $('user-email').textContent = userData.email || currentUser.email;
      renderField('firstName');
      renderField('lastName');
      renderSubscription();
      markLoaded();
    }

    async function createUserDoc(userId) {
      if (creatingDoc) return;
      creatingDoc = true;
      // No entitlement fields here - FastSpring owns those and Firestore
      // rules reject client writes to them. A document carrying none of
      // them reads as no access, which is the correct default.
      const displayName = currentUser.displayName || '';
      const basicUserData = {
        email: currentUser.email,
        firstName: displayName.split(' ')[0] || '',
        lastName: displayName.split(' ').slice(1).join(' '),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdVia: 'dashboard_auto_create',
        lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try {
        // The listener renders the new document as soon as it is written.
        await firestore.collection('users').doc(userId).set(basicUserData, { merge: true });
      } catch (error) {
        console.error('Could not create user document:', error);
        showNotice('We could not set up your account. Please try again.');
      } finally {
        creatingDoc = false;
      }
    }

    function handleLoadError(error) {
      console.error('Dashboard load failed:', error);
      clearTimeout(loadTimer);
      if (error.code === 'permission-denied') {
        showNotice('Access denied. Please sign out and sign in again.');
      } else {
        showNotice('We could not load your account. Check your connection and try again.');
      }
    }

    function subscribeToUser(userId) {
      if (unsubscribeUserDoc) unsubscribeUserDoc();
      hideNotice();

      // Only an empty page needs a timeout; cached data on screen can wait.
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => {
        if (!userData) showNotice('This is taking longer than usual. Check your connection and try again.');
      }, LOAD_TIMEOUT_MS);

      unsubscribeUserDoc = firestore.collection('users').doc(userId).onSnapshot(
        { includeMetadataChanges: true },
        (doc) => {
          if (doc.exists) {
            userData = doc.data();
            render();
            if (!doc.metadata.fromCache) {
              clearTimeout(loadTimer);
              hideNotice();
            }
          } else if (!doc.metadata.fromCache) {
            // Only the server can say the document is truly missing.
            clearTimeout(loadTimer);
            createUserDoc(userId);
          }
        },
        handleLoadError
      );
    }

    // Inline editing
    function setEditing(row, editing) {
      const input = row.querySelector('[data-role="input"]');
      row.querySelector('[data-role="value"]').hidden = editing;
      row.querySelector('[data-role="edit"]').hidden = editing;
      row.querySelector('[data-role="save"]').hidden = !editing;
      row.querySelector('[data-role="cancel"]').hidden = !editing;
      row.querySelector('[data-role="error"]').hidden = true;
      input.hidden = !editing;
      if (editing) {
        input.value = (userData && userData[row.dataset.field]) || '';
        input.focus();
      } else {
        row.querySelector('[data-role="edit"]').focus();
      }
    }

    async function saveField(row) {
      const fieldName = row.dataset.field;
      const input = row.querySelector('[data-role="input"]');
      const saveBtn = row.querySelector('[data-role="save"]');
      const errorEl = row.querySelector('[data-role="error"]');
      const newValue = input.value.trim();

      if (!newValue) {
        errorEl.textContent = 'This field can’t be empty.';
        errorEl.hidden = false;
        input.focus();
        return;
      }

      saveBtn.disabled = true;
      try {
        await firestore.collection('users').doc(currentUser.uid).update({ [fieldName]: newValue });
        userData[fieldName] = newValue;
        setEditing(row, false);
        render();
      } catch (error) {
        console.error('Error updating field:', error);
        errorEl.textContent = 'Couldn’t save. Please try again.';
        errorEl.hidden = false;
      } finally {
        saveBtn.disabled = false;
      }
    }

    document.querySelectorAll('[data-field]').forEach((row) => {
      row.querySelector('[data-role="edit"]').addEventListener('click', () => setEditing(row, true));
      row.querySelector('[data-role="cancel"]').addEventListener('click', () => setEditing(row, false));
      row.querySelector('[data-role="save"]').addEventListener('click', () => saveField(row));
      row.querySelector('[data-role="input"]').addEventListener('keydown', (e) => {
        // preventDefault stops the same Enter from then clicking the Edit
        // button, which takes focus once the save resolves.
        if (e.key === 'Enter') { e.preventDefault(); saveField(row); }
        if (e.key === 'Escape') { e.preventDefault(); setEditing(row, false); }
      });
    });

    async function cleanSignOut() {
      const btn = $('sign-out-btn');
      btn.textContent = 'Signing out…';
      btn.disabled = true;
      signingOut = true;

      if (unsubscribeUserDoc) {
        unsubscribeUserDoc();
        unsubscribeUserDoc = null;
      }

      try {
        await auth.signOut();
        // clearPersistence only works once Firestore is terminated; without
        // this the cached user document stayed on the device.
        await firestore.terminate();
        await firestore.clearPersistence();
      } catch (error) {
        console.warn('Sign-out cleanup incomplete:', error.message);
      }

      window.location.href = '/login';
    }

    $('sign-out-btn').addEventListener('click', cleanSignOut);
    $('retry-btn').addEventListener('click', () => {
      if (currentUser) subscribeToUser(currentUser.uid);
    });

    // The listener reconnects on its own; resubscribe only if nothing ever loaded.
    window.addEventListener('online', () => {
      if (currentUser && !userData) subscribeToUser(currentUser.uid);
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        subscribeToUser(user.uid);
      } else if (!signingOut) {
        window.location.href = '/login';
      }
    });
  </script>
</body>
</html>
