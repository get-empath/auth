<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Empath</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    /*
     * Tokens from the marketing site (EmpathWebsite/src/app/globals.css), as
     * on checkout.html. The brand gradient only goes on surfaces nothing sits
     * on; its ends are too light for type on white.
     */
    :root {
      --ink-50: #f7f7f8;
      --ink-100: #ededf0;
      --ink-200: #d9d9df;
      --ink-300: #b9b9c4;
      --ink-400: #8c8c9c;
      --ink-500: #6b6b7b;
      --ink-600: #52525f;
      --ink-700: #3f3f4a;
      --ink-800: #26262e;
      --ink-900: #15151a;
      --ink-950: #0b0b0e;
      --accent-50: #fef4f2;
      --accent-200: #fbcbc3;
      --accent-500: #dc4733;
      --accent-700: #ab2519;
      --accent-800: #8a1f16;
      --brand-gold: #f2c33c;
      --sky-200: #cfe8f0;
      --sky-600: #317f98;
      --gradient-brand: linear-gradient(to right bottom, #8ac6d9, #77b4e6, #9199e5, #be75c8, #dd4a8d, #e9446b, #e94c47, #de5c1d, #e6771c, #eb9121, #f0aa2c, #f2c33c);
      --gradient-brand-h: linear-gradient(to right, #8ac6d9, #9199e5, #dd4a8d, #e94c47, #e6771c, #f2c33c);
      --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--ink-50);
      color: var(--ink-800);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    a { color: var(--accent-700); }
    a:hover { color: var(--accent-800); }

    :focus-visible {
      outline: 2px solid var(--accent-500);
      outline-offset: 2px;
    }

    .site-header {
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--ink-100);
    }

    .site-header-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 32px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--ink-900);
      text-decoration: none;
    }

    .wordmark:hover { color: var(--ink-900); }

    .header-aside {
      margin: 0;
      font-size: 14px;
      color: var(--ink-600);
    }

    .header-aside a {
      font-weight: 600;
      text-decoration: none;
    }

    main {
      flex-grow: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 64px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--ink-200);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(11, 11, 14, 0.06), 0 8px 10px -6px rgba(11, 11, 14, 0.06);
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      display: block;
      height: 4px;
      background-image: var(--gradient-brand-h);
    }

    .auth-body { padding: 36px 36px 32px; }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .gradient-text {
      display: inline-block;
      background-image: var(--gradient-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: var(--brand-gold);
      -webkit-text-fill-color: transparent;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.024em;
      font-weight: 700;
      color: var(--ink-900);
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 15px;
      color: var(--ink-500);
    }

    .form-group { margin-bottom: 16px; }

    .label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-700);
    }

    .label-row label { margin: 0; }
    .form-group > label { margin-bottom: 6px; }

    .label-link {
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }

    .label-link:hover { text-decoration: underline; }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      background: #fff;
      color: var(--ink-900);
      /* 16px keeps iOS Safari from zooming the page on focus. */
      font-size: 16px;
      transition: border-color 150ms, box-shadow 150ms;
    }

    input::placeholder { color: var(--ink-400); }

    input:hover { border-color: var(--ink-300); }

    input:focus {
      outline: none;
      border-color: var(--ink-900);
      box-shadow: 0 0 0 3px rgba(11, 11, 14, 0.08);
    }

    /* Matches the primary button on the marketing site: black, not the
       gradient. */
    .submit {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 0 24px;
      border: 0;
      border-radius: 9999px;
      background: var(--ink-950);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms;
    }

    .submit:hover { background: var(--ink-800); }

    .submit:disabled {
      background: var(--ink-700);
      cursor: not-allowed;
    }

    .progress-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--ink-600);
    }

    .progress-indicator.show { display: flex; }

    /* A ring cut from the brand ramp, as on checkout. */
    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #8ac6d9, #9199e5, #dd4a8d, #e94c47, #e6771c, #f2c33c, rgba(242, 195, 60, 0));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .message:empty { display: none; }

    .message a { font-weight: 600; }

    .message.error {
      background: var(--accent-50);
      border: 1px solid var(--accent-200);
      color: var(--accent-800);
    }

    .message.success {
      background: var(--sky-200);
      color: var(--ink-900);
      font-weight: 500;
    }

    .message.info {
      background: var(--ink-100);
      color: var(--ink-800);
    }

    .switch-link {
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--ink-100);
      text-align: center;
      font-size: 14px;
      color: var(--ink-600);
    }

    .switch-link a {
      font-weight: 600;
      text-decoration: none;
    }

    .switch-link a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
      input, .submit { transition: none; }
    }

    @media (max-width: 640px) {
      .site-header-inner { padding: 0 16px; }
      .header-aside-label { display: none; }
      main {
        align-items: flex-start;
        padding: 24px 16px 40px;
      }
      .auth-body { padding: 28px 20px 24px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="https://www.get-empath.com" class="wordmark">Empath</a>
      <p class="header-aside">
        <span class="header-aside-label">New to Empath?</span>
        <a href="https://get-empath.com/signup" id="header-signup-link">Create an account</a>
      </p>
    </div>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-body">
        <div class="auth-heading">
          <p class="eyebrow"><span class="gradient-text">Welcome back</span></p>
          <h1>Sign in</h1>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@company.com" autocomplete="email">
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" id="forgot-password-link" class="label-link">Forgot password?</a>
            </div>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          </div>

          <button type="submit" id="submit-btn" class="submit">Sign In</button>

          <div class="progress-indicator" id="progress-indicator" role="status">
            <div class="spinner" aria-hidden="true"></div>
            Signing in…
          </div>

          <div class="message" id="form-message" role="alert"></div>

          <p class="switch-link">
            Don't have an account? <a href="https://get-empath.com/signup" id="signup-link">Create one</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Firebase Configuration - Consider moving to environment variables
    const firebaseConfig = {
      apiKey: 'AIzaSyCwpPROFnBDsX4gqdIbVsUgCZGkcvtWEKY',
      authDomain: 'auth.get-empath.com',
      projectId: 'get-empath',
      storageBucket: 'get-empath.firebasestorage.app',
      messagingSenderId: '380829207707',
      appId: '1:380829207707:web:e3b97e0bb83734ba2f4a3e',
      measurementId: 'G-W10VEF7WQL'
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestore = firebase.firestore();

    const loginForm = document.getElementById('login-form');
    const formMessage = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');
    const progressIndicator = document.getElementById('progress-indicator');
    const forgotPasswordLink = document.getElementById('forgot-password-link');

    /**
     * Where to go after sign-in. A checkout page sends signed-out visitors here
     * with ?next=<its path>; anything other than our own checkout paths falls
     * back to the dashboard, so the parameter can't be used to redirect off-site.
     */
    const ALLOWED_NEXT_PATHS = ['/checkout', '/enterprise/checkout'];

    function getRedirectTarget() {
      const next = new URLSearchParams(window.location.search).get('next');
      if (!next) return '/dashboard';

      try {
        const url = new URL(next, window.location.origin);
        if (url.origin === window.location.origin && ALLOWED_NEXT_PATHS.includes(url.pathname)) {
          return url.pathname + url.search;
        }
      } catch (error) {
        console.warn('Ignoring invalid next parameter:', next);
      }
      return '/dashboard';
    }

    const redirectTarget = getRedirectTarget();
    const isEnterpriseFlow = redirectTarget.startsWith('/enterprise');

    // Keep enterprise visitors in the enterprise flow if they need an account
    const signupUrl = isEnterpriseFlow ? '/enterprise' : 'https://get-empath.com/signup';
    document.getElementById('signup-link').href = signupUrl;
    document.getElementById('header-signup-link').href = signupUrl;

    // Check if user is already signed in
    auth.onAuthStateChanged((user) => {
      if (user) {
        console.log('User already signed in, redirecting to', redirectTarget);
        window.location.href = redirectTarget;
      }
    });

    // Show message helper
    function showMessage(text, type = 'info') {
      formMessage.innerHTML = text;
      formMessage.className = `message ${type}`;
    }

    // Progress indicator helper
    function showProgress() {
      progressIndicator.classList.add('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing In...';
    }

    function hideProgress() {
      progressIndicator.classList.remove('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }

    // Login form handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMessage.innerHTML = '';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Basic validation
      if (!email || !password) {
        showMessage('Please enter both email and password.', 'error');
        return;
      }

      showProgress();
      console.log('Starting login process for:', email);

      try {
        // Sign in with Firebase Auth
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        console.log('Login successful:', user.uid);
        showMessage('✅ Login successful! Redirecting...', 'success');
        
        // Redirect to dashboard (or back to checkout) after short delay
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 1000);

      } catch (error) {
        hideProgress();
        console.error('Login error:', error);
        
        // Enhanced error handling with user-friendly messages
        let errorMessage = 'Login failed. Please try again.';
        
        switch (error.code) {
          case 'auth/user-not-found':
            errorMessage = `No account found with this email address. <a href="${signupUrl}">Create an account</a>`;
            break;
          case 'auth/wrong-password':
            errorMessage = 'Incorrect password. Please try again or reset your password.';
            break;
          case 'auth/invalid-email':
            errorMessage = 'Please enter a valid email address.';
            break;
          case 'auth/user-disabled':
            errorMessage = 'This account has been disabled. Please contact support.';
            break;
          case 'auth/too-many-requests':
            errorMessage = 'Too many failed login attempts. Please try again later or reset your password.';
            break;
          case 'auth/network-request-failed':
            errorMessage = 'Network error. Please check your connection and try again.';
            break;
          case 'auth/invalid-credential':
            errorMessage = 'Invalid email or password. Please check your credentials and try again.';
            break;
          default:
            errorMessage = `Login failed: ${error.message}`;
        }
        
        showMessage(errorMessage, 'error');
      }
    });

    // Forgot password handler
    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      
      if (!email) {
        showMessage('Please enter your email address first.', 'info');
        document.getElementById('email').focus();
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        showMessage(`Password reset email sent to ${email}. Please check your inbox.`, 'success');
      } catch (error) {
        console.error('Password reset error:', error);
        
        let errorMessage = 'Failed to send password reset email.';
        
        switch (error.code) {
          case 'auth/user-not-found':
            errorMessage = 'No account found with this email address.';
            break;
          case 'auth/invalid-email':
            errorMessage = 'Please enter a valid email address.';
            break;
          case 'auth/too-many-requests':
            errorMessage = 'Too many password reset attempts. Please try again later.';
            break;
          default:
            errorMessage = `Password reset failed: ${error.message}`;
        }
        
        showMessage(errorMessage, 'error');
      }
    });

    // Focus on email input for better UX
    document.getElementById('email').focus();

    console.log('Login page loaded');
  </script>
</body>
</html>
